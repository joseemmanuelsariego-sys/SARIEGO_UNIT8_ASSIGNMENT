name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Contentful connection
        env:
          CMS: ${{ vars.CMS }}
          CMS_SPACE: ${{ vars.CMS_SPACE }}
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
        run: |
          echo "CMS: ${CMS:-MISSING}"
          echo "CMS_SPACE: ${CMS_SPACE:-MISSING}"

          if [ -z "$CMS_TOKEN" ]; then
            echo "CMS_TOKEN: MISSING"
            exit 1
          else
            echo "CMS_TOKEN: PRESENT"
          fi

          STATUS=$(curl -sS -o /tmp/contentful.json -w "%{http_code}" \
            -H "Authorization: Bearer $CMS_TOKEN" \
            "https://cdn.contentful.com/spaces/$CMS_SPACE/environments/master/entries?content_type=fairEvent&limit=1")

          echo "Contentful HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            cat /tmp/contentful.json
            exit 1
          fi

          echo "Published events: $(jq -r '.total' /tmp/contentful.json)"

      - name: Build Flutter web
        run: >
          flutter build web --release
          --base-href /SARIEGO_UNIT8_ASSIGNMENT/
          --dart-define=CMS=${{ vars.CMS }}
          --dart-define=CMS_SPACE=${{ vars.CMS_SPACE }}
          --dart-define=CMS_TOKEN=${{ secrets.CMS_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
